<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Maison Studio</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maison">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#23262B">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%2323262B'/%3E%3Ctext x='90' y='118' font-family='Georgia,serif' font-size='90' font-weight='500' fill='%23EAE4D8' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%2323262B'/%3E%3Ctext x='90' y='118' font-family='Georgia,serif' font-size='90' font-weight='500' fill='%23EAE4D8' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --paper: #EAE4D8;
    --paper-dark: #DDD5C3;
    --ink: #23262B;
    --ink-soft: #4A4E55;
    --muted: #7A7566;
    --red: #A6363B;
    --gold: #A9822C;
    --line: #C9BFA8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Cormorant Garamond',serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  .top-rule{border-top:3px solid var(--ink);}
  .bottom-rule{border-bottom:1px solid var(--line);}

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 24px;
  }

  h1{
    font-family:'Marcellus',serif;
    font-weight:400;
    font-size:clamp(48px, 12vw, 88px);
    line-height:0.95;
    letter-spacing:0.5px;
    margin:0;
  }

  .studio-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.5em;
    text-transform:uppercase;
    color:var(--muted);
    margin:8px 0 26px;
  }

  .tagline{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:500;
    font-size:22px;
    color:var(--ink);
    margin:0 0 12px;
  }

  .description{
    font-family:'Cormorant Garamond',serif;
    font-size:17px;
    color:var(--ink-soft);
    max-width:420px;
    line-height:1.6;
    margin:0 0 42px;
  }

  .world{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:50px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .world span.dot{color:var(--gold);}

  .enter-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    padding:16px 30px;
    cursor:pointer;
    border-radius:2px;
    text-decoration:none;
    transition:background .15s ease;
  }
  .enter-btn:hover{background:var(--red);}
  .enter-btn .arrow-icon{transition:transform .15s ease;}
  .enter-btn:hover .arrow-icon{transform:translateX(3px);}

  footer{
    text-align:center;
    padding:18px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--muted);
    letter-spacing:0.04em;
  }
</style>
</head>
<body>

<div class="top-rule"></div>

<main>
  <h1>Maison</h1>
  <div class="studio-label">Studio</div>

  <p class="tagline">Your creative world.</p>
  <p class="description">A home for your ideas, content, plans, goals, inspiration, and everything you're building.</p>

  <div class="world">
    <span>Ideas</span><span class="dot">·</span>
    <span>Content</span><span class="dot">·</span>
    <span>Planner</span><span class="dot">·</span>
    <span>Goals</span><span class="dot">·</span>
    <span>Inbox</span>
  </div>

  <a class="enter-btn" href="board.html">
    Enter Maison <span class="arrow-icon">→</span>
  </a>
</main>

<div class="bottom-rule"></div>
<footer>MAISON STUDIO · PERSONAL EDITION</footer>

</body>
</html>
