<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>The Desk</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Desk">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#23262B">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%2323262B'/%3E%3Ctext x='90' y='118' font-family='Georgia,serif' font-size='90' font-weight='700' fill='%23EAE4D8' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%2323262B'/%3E%3Ctext x='90' y='118' font-family='Georgia,serif' font-size='90' font-weight='700' fill='%23EAE4D8' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --paper: #EAE4D8;
    --paper-dark: #DDD5C3;
    --ink: #23262B;
    --ink-soft: #4A4E55;
    --muted: #7A7566;
    --red: #A6363B;
    --gold: #A9822C;
    --line: #C9BFA8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  .top-rule{border-top:3px solid var(--ink);}
  .bottom-rule{border-bottom:1px solid var(--line);}

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 24px;
  }

  .kicker{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--red);
    margin-bottom:18px;
  }

  h1{
    font-family:'Fraunces',serif;
    font-optical-sizing:auto;
    font-weight:700;
    font-size:clamp(48px, 12vw, 92px);
    line-height:0.92;
    letter-spacing:-1px;
    margin:0 0 18px;
  }

  .tagline{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:17px;
    color:var(--ink-soft);
    max-width:420px;
    margin:0 0 36px;
    line-height:1.5;
  }

  .stages{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:44px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .stages span.stage{
    padding:4px 9px;
    border:1px solid var(--line);
    border-radius:2px;
    background:var(--paper-dark);
  }
  .stages .arrow{color:var(--line);}

  .enter-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:15px 28px;
    cursor:pointer;
    border-radius:2px;
    text-decoration:none;
    transition:background .15s ease;
  }
  .enter-btn:hover{background:var(--red);}
  .enter-btn .arrow-icon{transition:transform .15s ease;}
  .enter-btn:hover .arrow-icon{transform:translateX(3px);}

  footer{
    text-align:center;
    padding:18px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--muted);
    letter-spacing:0.04em;
  }
</style>
</head>
<body>

<div class="top-rule"></div>

<main>
  <div class="kicker">— a running log of everything in the works —</div>
  <h1>The Desk</h1>
  <p class="tagline">Every idea, from scrap to press. Capture it, move it, ship it &mdash; without losing track of what's next.</p>

  <div class="stages">
    <span class="stage">Idea</span><span class="arrow">→</span>
    <span class="stage">Outline</span><span class="arrow">→</span>
    <span class="stage">Draft</span><span class="arrow">→</span>
    <span class="stage">Review</span><span class="arrow">→</span>
    <span class="stage">Scheduled</span><span class="arrow">→</span>
    <span class="stage">Published</span>
  </div>

  <a class="enter-btn" href="board.html">
    Enter the Desk <span class="arrow-icon">→</span>
  </a>
</main>

<div class="bottom-rule"></div>
<footer>THE DESK · PERSONAL EDITION</footer>

</body>
</html>
